<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thief and Police — Web prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#151c29;color:#eef2fb;margin:0;padding:24px;text-align:center}
main{max-width:750px;margin:auto}h1{margin:0 0 6px}p{color:#b6c4d9}canvas{display:block;width:min(100%,620px);height:auto;margin:18px auto;background:#f2eadb;border-radius:12px;touch-action:none}
button{background:#304b76;color:white;border:1px solid #6583b1;border-radius:8px;padding:10px 16px;margin:4px;font-size:16px;cursor:pointer}button:hover{background:#456a9e}select{font-size:16px;padding:8px;background:#263a58;color:#fff;border:1px solid #6583b1;border-radius:6px;margin:4px}#navigation{margin-top:14px}
#status{min-height:2em;font-weight:bold}kbd{border:1px solid #73829b;border-radius:4px;padding:2px 5px}
</style></head><body><main><h1>Thief and Police</h1><p>Web版・ステージ選択対応</p>
<div id="navigation"><label for="world">ワールド</label> <select id="world"></select> <label for="stage">ステージ</label> <select id="stage"></select> <button id="load">プレイ</button></div>
<canvas id="board" width="620" height="620" aria-label="ゲーム盤面"></canvas>
<div id="status" aria-live="polite">読み込み中...</div>
<div><button data-dir="0">↑</button><br><button data-dir="3">←</button><button data-dir="2">↓</button><button data-dir="1">→</button></div>
<div><button id="next">次のステージ →</button><button id="undo">一手戻す (Z)</button><button id="reset">最初から (R)</button></div>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> または矢印キーで移動。操作中のキャラクターは後退できません。</p>
</main><script src="play.js"></script><script src="game.js"></script></body></html>
