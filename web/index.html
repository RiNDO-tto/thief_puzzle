<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thief and Police — Web prototype</title>
<style>
:root{font-family:system-ui,"Noto Sans",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(ellipse at 50% 0%,#40576b,#1a2535 70%);color:#f5f1e8;text-align:center}main{max-width:820px;margin:auto}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.035em}p{color:#d2dce6}canvas{display:block;width:min(100%,620px);height:auto;margin:12px auto;background:#282d39;border:5px solid #75859b;border-radius:12px}button{font:inherit;cursor:pointer;border:2px solid #4a5c6c;border-radius:10px;background:#fff0d0;color:#273447;padding:10px 16px;margin:3px;font-weight:700}button:hover{background:#ffd67c}button:focus-visible{outline:3px solid #ffc54e;outline-offset:2px}button:disabled{opacity:.45;cursor:default}#status{min-height:2em;font-weight:700}kbd{border:1px solid #73829b;border-radius:4px;padding:2px 5px}#navigation{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}#navigation select,#navigation label,#navigation #load{display:none}#menuOverlay{position:fixed;inset:0;z-index:20;background:rgba(9,15,25,.85);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#menuOverlay[hidden]{display:none}#menuPanel{width:min(650px,100%);max-height:min(92vh,850px);overflow:auto;text-align:left;background:#26364a;border:3px solid #94a9b5;border-radius:18px;padding:24px;box-shadow:0 18px 55px #0009}#menuPanel h2{margin:0 0 8px;font-size:28px}#menuPanel p{margin:6px 0 18px}.menu-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.menu-card{text-align:left;min-height:98px;margin:0;background:#f8edcf}.menu-card strong{display:block;font-size:19px}.menu-card small{display:block;margin-top:7px;font-size:13px}.menu-card.done{border-color:#6bcfa2}.menu-back{background:#d8e5ed}#menuCrumb{font-size:14px;color:#b9cfdb}#menuClose[hidden],#menuBack[hidden]{display:none}#progressSummary{font-weight:700;color:#f8d78d}.control-row{display:flex;justify-content:center;flex-wrap:wrap}@media(max-width:520px){body{padding:12px}#menuPanel{padding:16px}button{padding:9px 12px}canvas{border-width:3px}}
</style></head><body><main><h1>Thief and Police</h1><p>Web版・画像対応</p>
<div id="navigation"><button id="openMenu">☰ ワールド・ステージ選択</button><span id="currentLabel"></span><label for="world">ワールド</label><select id="world"></select><label for="stage">ステージ</label><select id="stage"></select><button id="load">プレイ</button></div>
<div id="menuOverlay" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><div id="menuPanel"><div class="menu-top"><h2 id="menuTitle">ステージ選択</h2><button id="menuClose" hidden>閉じる</button></div><p id="progressSummary"></p><div class="menu-top"><button id="menuBack" class="menu-back" hidden>← ワールド一覧</button><span id="menuCrumb"></span></div><div id="menuGrid" class="menu-grid"></div><p>ステージは自由に選択できます。クリア記録はこのブラウザに保存されます。</p></div></div>
<canvas id="board" width="620" height="620" aria-label="ゲーム盤面"></canvas>
<div id="status" aria-live="polite">読み込み中...</div>
<div><button data-dir="0">↑</button><br><button data-dir="3">←</button><button data-dir="2">↓</button><button data-dir="1">→</button></div>
<div><button id="next">次のステージ →</button><button id="undo">一手戻す (Z)</button><button id="reset">最初から (R)</button></div>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> または矢印キーで移動。操作中のキャラクターは後退できません。</p>
</main><script src="play.js"></script><script src="game.js"></script></body></html>
